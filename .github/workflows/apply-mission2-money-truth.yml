name: Apply Mission 2 money truth package

on:
  push:
    branches:
      - agent/mission2-money-truth-certification
    paths:
      - ".github/mission2-patch-gz/**"
      - ".github/workflows/apply-mission2-money-truth.yml"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-mission2-money-truth
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/mission2-patch-gz/part-* | base64 --decode | gzip -dc > /tmp/mission2.patch
          echo "9cc5a36311c3214ced81a07bc6cac14e734780346299827b33a061d684316414  /tmp/mission2.patch" | sha256sum -c -
          git apply --check /tmp/mission2.patch

      - name: Apply patch
        run: git apply /tmp/mission2.patch

      - name: Install dependencies
        run: npm ci

      - name: Validate Mission 2
        run: npm run verify:deployment

      - name: Commit Mission 2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1 BLOCKER-2 — Money truth certification foundation"
          git push origin HEAD:agent/mission2-money-truth-certification
